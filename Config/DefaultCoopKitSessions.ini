; Default project settings of CoopKit Sessions.
; Edit them in Project Settings > Plugins > CoopKit Sessions: the editor saves your version to the project's
; Config/DefaultCoopKitSessions.ini. With every field empty the plugin still works: requests without a profile use
; the built-in defaults of a new Sessions Profile, and a player who leaves returns to the game default map.

[/Script/CoopKitSessions.CKSessionsSettings]
DefaultProfile=
DefaultLobbyRules=
MenuMap=
bDedicatedServerHosts=True
InviteAcceptPolicy=EventOnly
